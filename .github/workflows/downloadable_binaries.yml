name: Create Downloadable Binaries

# Builds native downloadable binaries (terminal, macOS app, Windows exe).
# Sibling to "Deploy to GitHub Pages", which builds the WASM/web version.
on:
  # # Triggers the workflow on push events but only for the main branch
  # push:
  #   branches:
  #     - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      terminal:
        description: Terminal
        type: boolean
        default: true
      macos:
        description: MacOS
        type: boolean
        default: false
      windows:
        description: Windows
        type: boolean
        default: false

  # Runs automatically whenever a GitHub Release is published - builds and
  # attaches binaries to that release.
  release:
    types: [published]

permissions:
  contents: write

# CARGO_NET_GIT_FETCH_WITH_CLI makes Cargo use the system `git`; Cargo's
# built-in libgit2 fetcher would ignore the credential rewrite set up in each
# job's "Allow Cargo to fetch the private dependency" step.
# GIT_TERMINAL_PROMPT=0 makes any auth failure fail immediately instead of
# trying to prompt on a runner that has no terminal.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  # Builds the plain terminal binary on four platforms. The package tool
  # builds natively on each runner OS, so this spans four OS *runners*; it
  # does not cross-compile.
  build-terminal:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.terminal }}
    name: Build Terminal Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm
            os: macos-latest      # Apple Silicon (M-series) - currently macOS 15+
          - name: macos-intel
            os: macos-15-intel    # last supported Intel image; retires ~Fall 2027
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Cargo.toml depends on a PRIVATE repo (incredible-alpha). Anonymous git
      # over HTTPS can't clone it, so this rewrites every "https://github.com/"
      # URL to carry a PAT (repo secret INCREDIBLE_ALPHA; Settings > Secrets and
      # variables > Actions). Without it the build fails with git asking for a
      # username rather than an obvious "auth failed" message.
      #
      # Exported through GIT_CONFIG_* env vars (via GITHUB_ENV) rather than
      # `git config --global`, so it doesn't depend on ~/.gitconfig or
      # credential helpers, which differ between runner images (notably macOS
      # arm). It must run AFTER checkout: checkout fetches this repo with its
      # own token, and the rewrite would override that with a PAT that may not
      # have access to this repo.
      - name: Allow Cargo to fetch the private dependency
        shell: bash
        env:
          TOKEN: ${{ secrets.INCREDIBLE_ALPHA }}
        run: |
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${TOKEN}@github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The `package` binary is the repo's own build tool; every later build
      # step runs through it.
      - name: Build tools
        shell: bash
        run: cargo build --release --bin package && cp target/release/package* .

      # dist/ has been committed to this repo before (as docs/ was), so a
      # checkout can restore stale binaries from git history. Wipe it so only
      # freshly built output gets zipped and published.
      - name: Clean previous build output (Unix)
        if: matrix.name != 'windows'
        shell: bash
        run: rm -rf dist

      - name: Clean previous build output (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

      - name: Build terminal binary
        run: ./package terminal

      # Zip here, before upload-artifact. upload-artifact resets every file to
      # mode 644, which would strip the executable bit from macOS/Linux
      # binaries; a zip made on the build filesystem keeps it.
      #
      # Two steps because the Windows runner's Git Bash has no `zip`; Windows
      # uses PowerShell's Compress-Archive instead.
      - name: Zip terminal binary (Unix)
        if: matrix.name != 'windows'
        shell: bash
        run: |
          # The binary's name comes from the package tool, so look it up.
          file=$(ls dist/cli | head -n 1)
          zip -j "${file}-terminal-${{ matrix.name }}.zip" "dist/cli/$file"

      - name: Zip terminal binary (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $file = (Get-ChildItem dist/cli | Select-Object -First 1).Name
          $base = [System.IO.Path]::GetFileNameWithoutExtension($file)
          Compress-Archive -Path "dist\cli\$file" -DestinationPath "$base-terminal-windows.zip"

      - name: Upload terminal binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal-${{ matrix.name }}
          path: "*-terminal-${{ matrix.name }}.zip"

  # Builds the macOS-native binary (the macos-native feature) and wraps it
  # into a .app + .dmg.
  build-macos-native:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    name: Build macOS Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm
            os: macos-latest      # Apple Silicon (M-series) - currently macOS 15+
          - name: macos-intel
            os: macos-15-intel    # last supported Intel image; retires ~Fall 2027

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Cargo.toml depends on a PRIVATE repo (incredible-alpha). Anonymous git
      # over HTTPS can't clone it, so this rewrites every "https://github.com/"
      # URL to carry a PAT (repo secret INCREDIBLE_ALPHA; Settings > Secrets and
      # variables > Actions). Without it the build fails with git asking for a
      # username rather than an obvious "auth failed" message.
      #
      # Exported through GIT_CONFIG_* env vars (via GITHUB_ENV) rather than
      # `git config --global`, so it doesn't depend on ~/.gitconfig or
      # credential helpers, which differ between runner images (notably macOS
      # arm). It must run AFTER checkout: checkout fetches this repo with its
      # own token, and the rewrite would override that with a PAT that may not
      # have access to this repo.
      - name: Allow Cargo to fetch the private dependency
        shell: bash
        env:
          TOKEN: ${{ secrets.INCREDIBLE_ALPHA }}
        run: |
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${TOKEN}@github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build tools
        shell: bash
        run: cargo build --release --bin package && cp target/release/package* .

      # Remove any committed dist/ so stale output isn't bundled.
      - name: Clean previous build output
        shell: bash
        run: rm -rf dist

      - name: Build & bundle macOS native binary
        run: ./package macos --bundle

      # Zipped here so every job hands publish-release the same shape of
      # output (a ready-made zip). A .dmg has no meaningful executable bit,
      # but upload-artifact would still flatten permissions on anything else.
      # The zip name is derived from the .dmg name, lowercased, spaces to
      # underscores.
      - name: Zip macOS native artifact
        shell: bash
        run: |
          dmg=$(ls dist/native/*.dmg | head -n 1)
          base=$(basename "$dmg" .dmg | tr '[:upper:]' '[:lower:]' | tr ' ' '_')
          zip -j "${base}-macos-native-${{ matrix.name }}.zip" "$dmg"

      - name: Upload macOS native artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-native-${{ matrix.name }}
          path: "*-macos-native-${{ matrix.name }}.zip"

  # Builds the Windows-native binary. The output is dist/native/<AppName>.exe,
  # where <AppName> comes from Cargo.toml's [package.metadata.bundle] app_name.
  build-windows-native:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    name: Build Windows Native
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Cargo.toml depends on a PRIVATE repo (incredible-alpha). Anonymous git
      # over HTTPS can't clone it, so this rewrites every "https://github.com/"
      # URL to carry a PAT (repo secret INCREDIBLE_ALPHA; Settings > Secrets and
      # variables > Actions). Without it the build fails with git asking for a
      # username rather than an obvious "auth failed" message.
      #
      # Exported through GIT_CONFIG_* env vars (via GITHUB_ENV) rather than
      # `git config --global`, so it doesn't depend on ~/.gitconfig or
      # credential helpers, which differ between runner images (notably macOS
      # arm). It must run AFTER checkout: checkout fetches this repo with its
      # own token, and the rewrite would override that with a PAT that may not
      # have access to this repo.
      - name: Allow Cargo to fetch the private dependency
        shell: bash
        env:
          TOKEN: ${{ secrets.INCREDIBLE_ALPHA }}
        run: |
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${TOKEN}@github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build tools
        shell: bash
        run: cargo build --release --bin package && cp target/release/package* .

      # Remove any committed dist/ so stale output isn't bundled.
      - name: Clean previous build output
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

      - name: Build & bundle Windows native binary
        run: ./package windows --bundle

      # Zipped here so every job hands publish-release the same shape of
      # output. Uses PowerShell's Compress-Archive because Git Bash on the
      # Windows runner has no `zip`. The exe name is dynamic, so look it up.
      - name: Zip Windows native artifact
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\native -Filter *.exe | Select-Object -First 1).Name
          $base = [System.IO.Path]::GetFileNameWithoutExtension($exe).ToLowerInvariant().Replace(' ', '_')
          Compress-Archive -Path "dist\native\$exe" -DestinationPath "$base-windows-native.zip"

      - name: Upload Windows native artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-native
          path: "*-windows-native.zip"

  publish-release:
    name: Publish binaries
    needs: [build-terminal, build-macos-native, build-windows-native]
    # Runs when at least one build job succeeded. By default `needs` requires
    # ALL jobs to succeed and a skipped job blocks dependents, so a single
    # failed build, or a manual dispatch with only some targets checked, would
    # otherwise skip publishing. `!cancelled()` behaves like `always()` but
    # still stops when the workflow is cancelled.
    if: ${{ !cancelled() && (needs.build-terminal.result == 'success' || needs.build-macos-native.result == 'success' || needs.build-windows-native.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Each artifact is already a finished zip, so just gather them.
      - name: Collect zips for release
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          ls -la release-assets

      # On a published Release, attach the zips to that release (versioned,
      # permanent; the action finds the release from the triggering event).
      # On workflow_dispatch, publish to a rolling "latest" tag so there is
      # always a stable download link between releases.
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name != 'release' && 'latest' || '' }}
          name: ${{ github.event_name != 'release' && 'Latest Build' || '' }}
          prerelease: ${{ github.event_name != 'release' }}
          files: release-assets/*.zip